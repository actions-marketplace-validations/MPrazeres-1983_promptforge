provider: openai
model: llama-3.3-70b-versatile
params:
  temperature: 0.0
  max_tokens: 300
evaluators:
  - type: heuristic
    name: json_validity
  - type: heuristic
    name: schema_match
  - type: heuristic
    name: field_match_category
    config:
      field: category
  - type: heuristic
    name: field_match_urgency
    config:
      field: urgency
  - type: heuristic
    name: field_match_team
    config:
      field: team
  - type: judge
    name: quality
    config:
      rubric: rubrics/support_quality.yaml
regression:
  thresholds:
    json_validity: 0.05
    schema_match: 0.05
    field_match_category: 0.10
    field_match_urgency: 0.10
    field_match_team: 0.10
