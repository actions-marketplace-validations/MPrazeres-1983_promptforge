provider: openai
model: llama-3.3-70b-versatile
params:
  temperature: 0.0
  max_tokens: 300
evaluators:
  - type: heuristic
    name: length_ok
    config:
      max_chars: 500
  - type: heuristic
    name: keyword_match
    config:
      keywords: []

regression:
  thresholds:
    json_validity: 0.05
    schema_match: 0.05
