name: PromptForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/promptforge

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src/promptforge --cov-report=term-missing

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v

      - name: Security audit
        run: pip-audit

  eval-smoke:
    name: Eval Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run quickstart eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd examples/quickstart
          promptforge init
          promptforge validate \
            --prompt prompts/summarizer.yaml \
            --dataset datasets/summarizer_golden.yaml
          promptforge eval \
            --prompt prompts/summarizer.yaml \
            --dataset datasets/summarizer_golden.yaml \
            --config configs/openai_gpt4o-mini.yaml